# Cabeçalhos de segurança (incluído em cada location, porque add_header num location substitui os do server).
# Sem Content-Security-Policy restritiva para não bloquear o Google Maps (iframe),
# o envio do formulário (EmailJS) e o Google Fonts.
# O Strict-Transport-Security é enviado pelo Nginx do servidor (HTTPS).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
