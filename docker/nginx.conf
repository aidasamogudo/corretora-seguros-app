# Nginx dentro do contentor: serve o build do Vite (SPA) em HTTP na porta 80.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    # Ficheiros do Vite com hash no nome: cache de 1 ano
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Imagens e ícones: cache de 7 dias
    location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # index.html nunca em cache, para os deploys novos aparecerem logo
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # Rotas da SPA (/servicos, /sobre, /contactos, /parceiros...) -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
